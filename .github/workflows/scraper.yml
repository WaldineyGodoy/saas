name: Neoenergia Invoice Scraper

on:
  # ⏸️ AGENDAMENTO PAUSADO em 06/08/2026 — reativar após validar o scraper.
  # Motivo: a versão nova (casamento de mês-alvo, conta mínima por evidência,
  # timeout 60s, upload no bucket privado) ainda não foi executada nenhuma vez.
  # Risco em aberto: o seletor `hasCheckbox` não foi validado na página real —
  # um falso positivo classificaria contas normais como "conta mínima" e as
  # removeria da fila de processamento.
  # Antes de reativar:
  #   1. Trocar o secret SUPABASE_KEY (GitHub) pela service_role — a anon key
  #      não passa pelo RLS e o robô não lê nem grava nada.
  #   2. Rodar manualmente via workflow_dispatch para UMA UC com fatura normal
  #      (ex.: 7030839328, Jul/2026, situação "Pago") e confirmar no log que ela
  #      NÃO foi classificada como conta mínima.
  # Para reativar: descomentar as duas linhas abaixo.
  # schedule:
  #   - cron: '0 8 * * *' # Diariamente às 05:00 BRT (08:00 UTC)
  workflow_dispatch:
    inputs:
      target_days:
        description: 'Dias de leitura (ex: 5 ou 1,2,3...)'
        required: false
        default: ''
      reason:
        description: 'Motivo do disparo manual'
        required: false
        default: 'Manual trigger from CRM'
  repository_dispatch:
    types: [trigger-scraper]

jobs:
  scrape:
    name: Executar Agente Neoenergia
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scraper
          npm install

      - name: Install Playwright Browsers
        run: |
          cd scraper
          npx playwright install firefox --with-deps

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_DAYS: ${{ github.event.inputs.target_days || github.event.client_payload.value || '' }}
        run: |
          cd scraper
          node scraper.js

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: scraper/downloads/debug/
