name: Neoenergia Invoice Scraper

# O AGENDAMENTO SAIU DAQUI em 04/09/2026, junto com o do emissor e o do
# enviador. Quem agenda agora é o pg_cron (`faturista-diario`, 08:07 UTC), que
# chama este workflow pela API do GitHub.
#
# Motivo: o `schedule` deste repositório parou de disparar por dias, sem aviso e
# sem rastro. O faturista ficou 2 dias e meio sem rodar e ninguém percebeu —
# nenhuma leitura nova entrou, e sem leitura o emissor não tem ciclo para fechar.
#
# O runner continua aqui porque o Chromium precisa de Xvfb e `headless: false`
# para passar pelo WAF (Akamai) da Neoenergia. Edge Function não roda navegador.
#
# Não reintroduza `schedule:` sem tirar o job do banco, ou o portal será varrido
# duas vezes por dia.
on:
  workflow_dispatch:
    inputs:
      target_days:
        description: 'Alvo: AAAA-MM-DD (dia+mês), AAAA-MM (mês inteiro) ou "5,12" (dias no mês corrente)'
        required: false
        default: ''
      reason:
        description: 'Motivo do disparo manual'
        required: false
        default: 'Manual trigger from CRM'
  repository_dispatch:
    types: [trigger-scraper]

jobs:
  scrape:
    name: Executar Agente Neoenergia
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      # O scraper usa CHROMIUM (antes era firefox).
      # Firefox headless passa pelo WAF mas recebe a aplicação sem o corpo;
      # chromium + display virtual é a combinação que funciona.
      - name: Install Playwright Chromium
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      # Xvfb = display virtual. Permite rodar o navegador em modo "com interface"
      # numa máquina sem monitor. Sem isso, headless=true -> Access Denied (Akamai).
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Scraper (dentro do display virtual)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_DAYS: ${{ github.event.inputs.target_days || github.event.client_payload.value || '' }}
          HEADLESS: 'false'   # obrigatório: headless real é bloqueado pelo portal
          SLOW_MO: '0'        # sem atraso artificial no CI
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node scraper.js

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: scraper/downloads/debug/
          if-no-files-found: ignore
          retention-days: 7
