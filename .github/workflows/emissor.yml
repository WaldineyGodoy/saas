name: Emissor de Faturas

# Cria a cobrança do ciclo fechado. Roda entre o faturista e o enviador:
#
#   08:00 UTC  faturista  baixa as contas da concessionária
#   10:00 UTC  emissor    emite o boleto do ciclo que fechou   <-- este
#   11:00 UTC  enviador   entrega ao assinante
#
# A hora é deliberada: uma folga de duas horas depois do faturista para que a
# leitura da manhã já esteja no banco, e uma hora antes do enviador para que o
# boleto emitido hoje saia hoje.
#
# O agendado APLICA — decisão do dono do sistema em 04/09/2026.
#
# Nasceu travado: o enviador entrega o que já existe, este cria dinheiro, e eu
# queria semanas de simulação antes de soltar. A simulação de 03/09 passou
# limpa — bloqueou o ciclo vazio de 06/2026, liberou os dois fechados, provou o
# login do robô e o papel admin — e o dono pediu o processo sem intervenção.
# Registro que a recomendação era esperar mais; a decisão de não esperar é dele
# e está tomada com o resultado à vista.
#
# O que segura o risco não é a simulação, é a guarda: `fn_fila_emissao_faturas`
# só libera ciclo fechado, o robô reconfere no banco imediatamente antes de
# emitir, a auditoria barra severidade 'erro', e há teto de itens e de valor.
#
# Para voltar a travar, apague a condição `github.event_name == 'schedule'` no
# passo final.

on:
  schedule:
    - cron: '17 10 * * *'  # 07:17 BRT — fora do topo da hora, faixa congestionada do GitHub
  workflow_dispatch:
    inputs:
      simular:
        description: 'Só simular (não cria cobrança)'
        type: boolean
        required: false
        default: true
      limite:
        description: 'Máximo de ciclos nesta execução'
        required: false
        default: '10'
      teto:
        description: 'Valor máximo de um boleto (R$)'
        required: false
        default: '50000'

jobs:
  emitir:
    name: Emitir cobranças de ciclo fechado
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Emitir faturas
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Opcional: se não existir, o login cai para SUPABASE_KEY. A chave só
          # serve de `apikey` para a requisição chegar no GoTrue; quem prova
          # identidade é o access_token do robô que volta do login.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Identidade própria do robô. Sem ela o portão requireAdmin barra, e é
          # assim que tem que ser — service_role no Authorization anularia a proteção.
          ROBO_EMAIL: ${{ secrets.ROBO_EMAIL }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
        run: |
          ARGS="--limite ${{ github.event.inputs.limite || '10' }} --teto ${{ github.event.inputs.teto || '50000' }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.simular }}" = "false" ]; then
            ARGS="$ARGS --aplicar"
          fi
          echo "node emissor.js $ARGS"
          node emissor.js $ARGS
